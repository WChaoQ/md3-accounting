name: Android CI and Release

on:
  push:
    branches:
      - gpt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run unit tests and build debug/release APKs
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --stacktrace --no-daemon

      - name: Verify release APK signature and package metadata
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "package: name='com.wchaoq.md3accounting' versionCode='2' versionName='1.0.1'"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: md3-accounting-debug-1.0.1
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: md3-accounting-release-1.0.1
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub prerelease
        if: success() && github.ref == 'refs/heads/gpt'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gpt-build-${{ github.run_number }}
          name: "MD3 Accounting 1.0.1 - gpt preview #${{ github.run_number }}"
          body_path: CHANGELOG.md
          files: app/build/outputs/apk/release/app-release.apk
          draft: false
          prerelease: true
          make_latest: false
