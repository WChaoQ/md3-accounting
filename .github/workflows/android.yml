name: Android CI and Release

on:
  push:
    branches:
      - gpt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Install Android command-line tools
        run: |
          ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd /tmp
          curl -fsSL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip
          mv cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Accept licenses and install Android SDK packages
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c6c987be6ef0b" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run unit tests and build debug/release APKs
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --stacktrace --no-daemon --max-workers=1

      - name: Verify release APK signature and package metadata
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "package: name='com.wchaoq.exp' versionCode='7' versionName='1.0.6'"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: zhi-chu-ji-lu-debug-1.0.6
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: zhi-chu-ji-lu-release-1.0.6
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub prerelease
        if: success() && github.ref == 'refs/heads/gpt'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gpt-build-${{ github.run_number }}
          name: "支出记录 1.0.6 - gpt preview #${{ github.run_number }}"
          body_path: CHANGELOG.md
          files: app/build/outputs/apk/release/app-release.apk
          draft: false
          prerelease: true
          make_latest: false
